name: Renovate

# Runs Renovate as this repo's own GitHub App (chillincool-tilegate-renovate)
# instead of a hosted service. The app's key lives in the "renovate"
# environment, which only the main branch can use, so no branch or pull
# request can read it.

on:
  schedule:
    - cron: "17 * * * *"   # hourly; update PRs are still limited by the schedule in renovate.json5
  push:
    branches: [main]
    paths: [.github/renovate.json5]
  workflow_dispatch:
    inputs:
      dryRun:
        description: Dry run (log what would change, open nothing)
        type: boolean
        default: false
      logLevel:
        description: Log level
        type: choice
        default: info
        options: [info, debug]

permissions: {}

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    environment: renovate
    timeout-minutes: 30
    steps:
      - name: Get a short-lived token for tilegate only
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Run Renovate
        uses: renovatebot/github-action@2804199d260ad00c1fae0e9e842888369391c776 # v46.3.10
        env:
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_PLATFORM_COMMIT: enabled   # commits made through the API, so GitHub marks them verified
          RENOVATE_DRY_RUN: ${{ inputs.dryRun && 'full' || '' }}
        with:
          token: ${{ steps.token.outputs.token }}
          renovate-version: 44.182.2   # Renovate keeps this updated itself
