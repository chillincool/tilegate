name: Release

# Pushing to main publishes ghcr.io/<owner>/tilegate:main for testing.
# Pushing a tag like v1.2.3 publishes the versioned image, the Helm chart, and
# a GitHub release with generated notes.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: write   # create the GitHub release
  packages: write   # push to ghcr.io

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/tilegate
  CHART_REPO: oci://ghcr.io/${{ github.repository_owner }}/charts

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=ref,event=branch
            type=sha
          labels: |
            org.opencontainers.image.title=tilegate
            org.opencontainers.image.licenses=MIT
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  chart:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
      - name: Package and push chart
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package charts/tilegate --version "$version" --app-version "$version" -d dist
          helm push "dist/tilegate-$version.tgz" "$CHART_REPO"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [image, chart]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag --notes "$(cat <<NOTES
          **Image:** \`$IMAGE:$version\` (linux/amd64, linux/arm64)
          **Helm chart:** \`helm install tilegate $CHART_REPO/tilegate --version $version\`
          NOTES
          )"
