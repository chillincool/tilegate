name: Release

# Pushing to main publishes ghcr.io/<owner>/tilegate:main for testing.
# Pushing a tag like v1.2.3 publishes the versioned image, the Helm chart, and
# a GitHub release with generated notes.
#
# Images and charts are signed with cosign "keyless": the signature is tied
# to this workflow's GitHub identity (id-token: write), so there is no
# signing key to store or leak. Verify with `cosign verify` (see the chart
# README).
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions: {}   # each job asks for exactly what it needs

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/tilegate
  CHART_REPO: oci://ghcr.io/${{ github.repository_owner }}/charts

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push to ghcr.io
      id-token: write   # keyless signing
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=ref,event=branch
            type=sha
          labels: |
            org.opencontainers.image.title=tilegate
            org.opencontainers.image.licenses=MIT
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Installs the cosign version this action release verifies.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        # Signing the multi-arch index digest covers both architectures.
        run: cosign sign --yes "$IMAGE@$DIGEST"

  chart:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push to ghcr.io
      id-token: write   # keyless signing
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
      # Installs the cosign version this action release verifies.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Package, push and sign the chart
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "$TOKEN" | helm registry login ghcr.io -u "$ACTOR" --password-stdin
          echo "$TOKEN" | cosign login ghcr.io -u "$ACTOR" --password-stdin
          # Keep the image listed for Artifact Hub in step with this release.
          sed -i "s|image: ghcr.io/chillincool/tilegate:.*|image: ghcr.io/chillincool/tilegate:$version|" charts/tilegate/Chart.yaml
          helm package charts/tilegate --version "$version" --app-version "$version" -d dist
          helm push "dist/tilegate-$version.tgz" "$CHART_REPO" 2>&1 | tee push.log
          digest=$(grep -o 'sha256:[0-9a-f]\{64\}' push.log | tail -1)
          test -n "$digest"
          cosign sign --yes "${CHART_REPO#oci://}/tilegate@$digest"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [image, chart]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub release
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag --notes "$(cat <<NOTES
          **Image:** \`$IMAGE:$version\` (linux/amd64, linux/arm64)
          **Helm chart:** \`helm install tilegate $CHART_REPO/tilegate --version $version\`
          NOTES
          )"
