name: Artifact Hub metadata

# Artifact Hub reads repository metadata (the verified-publisher ID) from an
# OCI artifact stored next to the chart under the "artifacthub.io" tag, not
# from git. This publishes charts/artifacthub-repo.yml there when it changes.
# https://artifacthub.io/docs/topics/repositories/helm-charts/

on:
  push:
    branches: [main]
    paths: [charts/artifacthub-repo.yml, .github/workflows/artifacthub.yml]
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      # Installs the ORAS version this action release ships checksums for;
      # Renovate updating the action moves it forward.
      - uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2
      - name: Push artifacthub-repo.yml
        working-directory: charts
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          REPO: ghcr.io/${{ github.repository_owner }}/charts/tilegate
        run: |
          echo "$TOKEN" | oras login ghcr.io -u "$ACTOR" --password-stdin
          oras push "$REPO:artifacthub.io" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml
