apiVersion: v1
kind: Service
metadata:
  name: {{ include "tilegate.fullname" . }}
  labels:
    {{- include "tilegate.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "tilegate.selectorLabels" . | nindent 4 }}
