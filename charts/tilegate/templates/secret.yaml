{{- if and (eq .Values.auth.mode "oidc") (not .Values.auth.existingSecret) }}
{{- $name := include "tilegate.fullname" . }}
{{- $session := .Values.auth.sessionSecret }}
{{- if not $session }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if and $existing (index $existing.data "session-secret") }}
{{- $session = index $existing.data "session-secret" | b64dec }}
{{- else }}
{{- $session = randAlphaNum 48 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "tilegate.labels" . | nindent 4 }}
type: Opaque
data:
  client-secret: {{ .Values.auth.clientSecret | b64enc | quote }}
  session-secret: {{ $session | b64enc | quote }}
{{- end }}
